{% extends 'base.html' %}


{% block body %}

<div class="centered-form">
<div class="row justify-content-center">
<div class="col-md-4">
    <h2 class="text-center mb-4 p-4">New Drive</h2>
    <form method="post">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input id="title" class="form-control" name="Title"
                 autofocus required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" type="text" class="form-control" name="Description"
                required></textarea>
        </div>
        <div class="mb-3">
            <label for="salary" class="form-label">Salary</label>
            <input id="salary" type="number" class="form-control" name="Salary"
                required>
        </div>
        <div class="mb-3">
            <label for="eligibility" class="form-label">Eligibility</label>
            <input id="eligibility" type="text" class="form-control" name="Eligibility"
                required>
            </div>
        <div class="mb-3">
            <label for="duration" class="form-label">Duration ( days )</label>
            <input id="duration" type="number" class="form-control" name="Duration"
                required>
            </div>
        
        <button type="submit" class="btn btn-primary">Create</button>
    </form>
    <!-- <p class="mt-3 text-center">
        New to this App? <a href="{{ url_for('company.company_register') }}"
            style="text-decoration: none;">Register</a>
    </p>
    <p class="text-center" style="font-size:11px">
        For Admin login <a href="{{ url_for('admin.admin_login') }}" style="text-decoration: none;">Click here</a>
    </p> -->
</div>
</div>
</div>

{% endblock %}
