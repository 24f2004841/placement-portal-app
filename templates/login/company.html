{% extends 'base.html' %}

<!-- {% block title %} Student Login {% endblock %} -->


{% block body %}

<div class="centered-form">
    <h2 class="text-center mb-4">Student Login</h2>
    <form method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username(email)</label>
            <input id="username" type="email" class="form-control" name="Username"
                 autofocus required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" class="form-control" name="Password"
                title="Password must be 8-12 characters long with atleast 1 num, and 1 uppercase and 1 lowercase alphabet."
                required>
            <input type="checkbox" class="form-check-input" id="showPassword" onclick="togglePassword()">
            <label class="form-check-label" for="showPassword">Show Password</label>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="mt-3 text-center">
        New to this App? <a href="{{ url_for('company.company_register') }}"
            style="text-decoration: none;">Register</a>
    </p>
    <p class="text-center" style="font-size:11px">
        For Admin login <a href="{{ url_for('admin.admin_login') }}" style="text-decoration: none;">Click here</a>
    </p>
</div>


{% endblock %}
