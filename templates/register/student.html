{% extends "base.html" %}

{% block title %}Student Registration{% endblock %}

{% block body %}

<div class="centered-form  row justify-content-center mt-3">
  <div class="col-md-4">
    <h2 class="text-center mb-4 fs-1 fw-bold">Student Registration</h2>
    <form method="post" onsubmit="return validatePasswords();">

      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input id="name" type="text" class="form-control" name="Name" title="Name should have atleast 3 characters"
          autofocus required>
      </div>

      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" class="form-control" name="Username" title="Please enter valid email" required>
      </div>
      <div class="mb-3">
        <label for="age" class="form-label">Age</label>
        <select id="age" name="Age" class="form-select" required>
          <option value="" disabled selected>Select your age</option>
          {% for age in range(18, 100) %}
          <option value="{{ age }}">{{ age }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label for="department" class="form-label">Department</label>
        <input id="department" type="text" class="form-control" name="Department" required>
      </div>
      <div class="mb-3">
        <label for="skills" class="form-label">Skills</label>
        <textarea id="skills" class="form-control" name="Skills" rows="2"
          placeholder="e.g. Python, Java, SQL"></textarea>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" class="form-control" name="Password"
          title="Password must be 8-12 characters long with atleast 1 num, and 1 uppercase and 1 lowercase alphabet."
          required>
      </div>
      <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input id="confirm_password" type="password" class="form-control" name="ConfirmPassword" required>
      </div>
      <div id="passwordError" class="text-danger mb-3" style="display: none;">Passwords do not match</div>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p class="mt-3 text-center">
      Already have an account? <a href="{{ url_for('student.student_login') }}" style="text-decoration: none;">Login</a>
    </p>
  </div>
</div>

<script>
  const password = document.getElementById("password");
  const confirmPassword = document.getElementById("confirm_password");
  const error = document.getElementById("passwordError");

  function validatePasswords() {
    if (password.value !== confirmPassword.value) {
      error.style.display = "block";
      return false;
    } else {
      error.style.display = "none";
      return true;
    }
  }
  confirmPassword.addEventListener("input", () => {
    if (password.value == confirmPassword.value) {
      error.style.display = "none";
    } else {
      error.style.display = "block";
    }
  });
</script>

{% endblock %}
