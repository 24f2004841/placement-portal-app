{% extends 'base.html' %}

{% block body %}

<div class="centered-form m-2">
  <h2 class="text-center mb-4 fs-1 fw-bold m-2">Edit Profile</h2>
  <a href="{{ url_for('student.student_dashboard') }}" class="btn btn-outline-secondary btn-sm">back</a>
  <form method="post">
    <div class="mb-3">
      <label for="age" class="form-label">Age</label>
      <select id="age" name="Age" class="form-select" required>
        <option value="" disabled selected>Select your age</option>
        {% for age in range(18, 100) %}
        <option value="{{ age }}">{{ age }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label for="department" class="form-label">Department</label>
      <input id="department" type="text" class="form-control" name="Department" required>
    </div>
    <div class="mb-3">
      <label for="skills" class="form-label">Skills</label>
      <textarea id="skills" class="form-control" name="Skills" rows="2" placeholder="e.g. Python, Java, SQL"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Update</button>
  </form>
</div>

{% endblock %}
